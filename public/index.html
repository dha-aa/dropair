<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Dropair · Your media gallery</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Dropair home">Gallery</a>
            <div class="topbar-actions">
                <button class="avatar" id="optionsButton" type="button" aria-label="Gallery options"></button>
                <div class="options-menu" id="optionsMenu" role="menu" aria-hidden="true">
                    <p>View and sort</p>
                    <button type="button" data-sort="modified" class="active">Newest first</button>
                    <button type="button" data-sort="size">Largest first</button>
                    <button type="button" data-sort="name">Name A–Z</button>
                    <hr>
                    <button type="button" data-layout="grid" class="active">Square grid</button>
                    <button type="button" data-layout="compact">Compact grid</button>
                </div>
            </div>
        </header>

        <h2 class="section-heading">Recent uploads</h2>
        <div id="galleryContainer" class="gallery-grid"></div>
    </main>

    <input type="file" id="fileInput" multiple hidden>

    <div id="lightbox" class="lightbox hidden">
        <button id="lightboxClose" class="lightbox-close" aria-label="Close">&times;</button>
        <div class="lightbox-content">
            <div id="lightboxMedia"></div>
            <div class="lightbox-footer"><span id="lightboxName"></span><a id="lightboxDownload" class="download" download>Download <span>↗</span></a></div>
        </div>
    </div>

    <nav class="bottom-dock" id="dock" aria-label="Gallery controls">
        <span class="dock-status" aria-live="polite"></span>
        <button type="button" class="dock-nav" data-dock-action="home" aria-label="Home">⌂</button>
        <button type="button" class="dock-nav" data-dock-action="gallery" aria-label="Gallery">▦</button>
        <button type="button" class="dock-nav" data-dock-action="upload" aria-label="Upload">＋</button>
        <button type="button" class="dock-select" data-dock-action="cancel" aria-label="Cancel selection">×</button>
        <button type="button" class="dock-select" data-dock-action="download" aria-label="Download selected">↓</button>
    </nav>
</body>
</html>
