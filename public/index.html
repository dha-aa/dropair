<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dropair</title>
</head>
<body>
<div class="container">
    <div class="upload-box">

    <input
        type="file"
        id="fileInput"
        class="file-input"
        multiple
    >

    <label for="fileInput" class="select-files">
        <span id="fileName">Select files</span>
    </label>

    <button id="uploadBtn">
        Upload
    </button>

</div>

    <div id="listContainer"></div>
</div>
    <script src="app.js"></script>
</body>
</html>
